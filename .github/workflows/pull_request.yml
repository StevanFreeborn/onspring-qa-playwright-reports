name: Pull Request
env:
  SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
  CSRF_SECRET: ${{ secrets.CSRF_SECRET }}
  COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
  NODE_ENV: test
  EMAIL_JS_SERVICE_ID: ${{ secrets.EMAIL_JS_SERVICE_ID }}
  EMAIL_JS_PUBLIC_KEY: ${{ secrets.EMAIL_JS_PUBLIC_KEY }}
  EMAIL_JS_PRIVATE_KEY: ${{ secrets.EMAIL_JS_PRIVATE_KEY }}
  NEW_ACCOUNT_EMAIL_TEMPLATE_ID: ${{ secrets.NEW_ACCOUNT_EMAIL_TEMPLATE_ID }}
  FORGOT_PASSWORD_EMAIL_TEMPLATE_ID: ${{ secrets.FORGOT_PASSWORD_EMAIL_TEMPLATE_ID }}
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '.vscode/**'
      - '.husky/**'
      - '.gitignore'
      - 'README.md'
      - 'LICENSE.md'
      - 'docker-compose.dev.yml'
      - 'example.env'
      - 'jsconfig.json'
jobs:
  format:
    name: Run Prettier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Run Prettier
        run: npm run format:check
  lint:
    name: Run ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint:check
  test:
    name: Run tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-jammy
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test
        env:
          HOME: /root
